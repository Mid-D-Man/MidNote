name: Build Android APK (debug)

# Manual trigger only — this produces a debug-signed APK for sideloading
# onto your own device, not a Play Store release. Debug signing means no
# keystore secrets required (without them the APK gets a throwaway key; with
# the ANDROID_* secrets from the "Make signing key" workflow it gets a stable
# one and installs over the previous build). Android will happily install it
# once you flip "install unknown apps" on for whatever app you use to open the file.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest's default free space (~14GB after preinstalled
      # tooling) plus four Android ABIs' worth of tauri/wry's dependency
      # tree is what actually exhausted the disk last run. Restricting the
      # build to one ABI only (below) should be enough on its own, but this
      # costs a few minutes and removes a second way to hit the same wall.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false # we need this one
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          # armv7, not aarch64: the Galaxy A13's SoC is 64-bit capable, but
          # Samsung ships this specific model running the OS itself in
          # 32-bit mode, so it only reports armeabi-v7a as installable
          # (confirmed via Samsung's own community forums, including a
          # Samsung moderator stating it directly) — regardless of what the
          # chip underneath can actually do.
          targets: armv7-linux-androideabi

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android's own default is just `tools platform-tools` — no
      # build-tools, meaning apksigner was never actually present in
      # mdix-cybs's earlier runs. Pin a specific build-tools version
      # explicitly.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0"

      # NDK 28+ is what Google now wants for the 16KB-page-size requirement
      # on new Play Store submissions — not relevant for sideloading a debug
      # build onto your own phone, so r26d (known-working) is fine here.
      # Bump this if/when you start caring about Play Store submissions.
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install frontend deps
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      # BUGFIX (real one, not speculative): this is the actual reason the
      # real MidNote launcher icon and adaptive-icon layers under
      # src-tauri/icons/android/ (regenerated from the real logo via
      # `npx tauri icon` in an earlier round) were never showing up as the
      # installed app's icon — only ever inside the app's own UI (the
      # landing-page header). `tauri android init` scaffolds gen/android
      # fresh from Tauri's own Android project template, which ships ITS
      # OWN placeholder ic_launcher assets — it does not read from
      # src-tauri/icons/android/ to populate them. Since gen/android isn't
      # committed (regenerated every run — see the manifest-patch step's
      # own comment on why), every single build silently produced an APK
      # with Tauri's stock icon, regardless of what sat in src-tauri/icons/.
      # This is a confirmed, documented gap, not unique to this project —
      # multiple real-world Tauri Android projects have hit exactly this
      # and needed the same kind of explicit post-init copy step.
      # Runs here, right after init and before the manifest patch, so
      # every step after this one operates on the real gen/android project
      # with the real icons already in place.
      - name: Apply MidNote launcher icons
        run: |
          set -e
          SRC="src-tauri/icons/android"
          DEST="src-tauri/gen/android/app/src/main/res"
          for density in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$DEST/$density"
            cp -f "$SRC/$density/ic_launcher.png" "$DEST/$density/ic_launcher.png"
            cp -f "$SRC/$density/ic_launcher_round.png" "$DEST/$density/ic_launcher_round.png"
            cp -f "$SRC/$density/ic_launcher_foreground.png" "$DEST/$density/ic_launcher_foreground.png"
            cp -f "$SRC/$density/ic_launcher_background.png" "$DEST/$density/ic_launcher_background.png"
          done
          mkdir -p "$DEST/mipmap-anydpi-v26"
          cp -f "$SRC/mipmap-anydpi-v26/ic_launcher.xml" "$DEST/mipmap-anydpi-v26/ic_launcher.xml"
          echo "Applied MidNote launcher icons over the generated Android project."

      # Round 34: the reminder notification's status-bar icon. The plugin
      # (tauri-plugin-notification) falls back to Android's built-in "i"
      # info icon unless the APK contains a drawable whose name is passed as
      # `icon` (src/lib/utils/reminders.ts NOTIFICATION_ICON =
      # "ic_stat_midnote"). Same reason as the launcher-icon step above:
      # gen/android is regenerated every run, so the files have to be copied
      # in every run. Each file is a white silhouette of the MidNote "M" on a
      # transparent background (Android only reads the alpha channel of a
      # small icon), pre-sized for every density. `set -e` + the explicit
      # existence check make a missing file fail the build loudly instead of
      # silently shipping the "i" again.
      - name: Apply MidNote notification icon
        run: |
          set -e
          SRC="src-tauri/icons/android-notification"
          DEST="src-tauri/gen/android/app/src/main/res"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "$SRC/drawable-$density/ic_stat_midnote.png"
            mkdir -p "$DEST/drawable-$density"
            cp -f "$SRC/drawable-$density/ic_stat_midnote.png" "$DEST/drawable-$density/ic_stat_midnote.png"
          done
          echo "Applied MidNote notification icon (5 densities)."

      # Default-generated manifest doesn't set windowSoftInputMode, which
      # leaves the soft keyboard free to overlay fixed-bottom UI (the
      # formatting toolbar) instead of the window resizing to make room
      # for it. adjustResize is the standard native-level fix — it
      # resizes the actual Android window, independent of whatever the
      # WebView does or doesn't propagate through dvh/visualViewport to
      # the web content (Tauri has a confirmed open issue, tauri-apps/
      # tauri#10631, where visualViewport doesn't reliably reflect
      # keyboard height changes on Android — so the app.html viewport
      # meta / 100dvh CSS alone can't be trusted to cover this). Runs
      # here, after init, because gen/android isn't committed — every
      # build regenerates a fresh manifest with none of this applied,
      # so it has to be patched every run rather than once. Uses
      # ElementTree instead of sed/grep: this is real XML with a
      # namespaced attribute, and a text-based edit risks corrupting it
      # depending on how Tauri wraps the <activity> tag's other
      # attributes across lines. Not verified on this exact WebView —
      # same honest caveat as everything else this session: adjustResize
      # is the textbook-standard fix for this symptom, but confirming it
      # actually keeps the toolbar visible with the keyboard up still
      # needs an on-device check after this build installs.
      # windowSoftInputMode from before, plus the storage permissions
      # plugin-fs needs for the $DOWNLOAD write access the download fix
      # depends on (fs:allow-download-write in capabilities/default.json
      # only grants the app-side permission — Android itself separately
      # needs these two <uses-permission> entries, per Tauri's own fs
      # plugin docs' Android-specific setup section, current as of this
      # writing). Same reasoning as before for doing this here rather
      # than committing gen/android: it's regenerated fresh every run,
      # so there's no manifest to hand-edit once and forget about.
      # Round 31 (reminders): the exact-alarm permissions. The notification
      # plugin (tauri-plugin-notification) schedules reminders through
      # AlarmManager and, per its own source, uses setExactAndAllowWhileIdle
      # only when the app is allowed to schedule exact alarms, otherwise the
      # inexact setAndAllowWhileIdle (a reminder can then arrive minutes late).
      #   - USE_EXACT_ALARM (Android 13+): granted automatically at install,
      #     no Settings screen. Google Play restricts it to alarm/calendar
      #     apps; MidNote is sideloaded, so that doesn't apply today. If the
      #     app is ever published on Play, swap this for SCHEDULE_EXACT_ALARM
      #     plus a "grant in Settings" prompt.
      #   - SCHEDULE_EXACT_ALARM, capped at Android 12L (maxSdkVersion 32):
      #     already granted by default on those versions. Capped because from
      #     Android 13 it is denied until the user grants it, and the line
      #     above makes it unnecessary there.
      # The plugin's own manifest contributes POST_NOTIFICATIONS, WAKE_LOCK and
      # RECEIVE_BOOT_COMPLETED through Gradle's manifest merge, so those are not
      # repeated here.
      - name: Patch AndroidManifest for keyboard resize, storage access and exact alarms
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          # Tauri's generated manifest also declares xmlns:tools (used for
          # things like tools:node merge hints). Registering it too is
          # just to stop ElementTree renaming it to an auto ns0: prefix
          # on write-back — cosmetic, but no reason to leave it ugly.
          ET.register_namespace("tools", "http://schemas.android.com/tools")

          tree = ET.parse(path)
          root = tree.getroot()

          activities = root.findall(".//activity")
          if not activities:
              raise SystemExit(f"No <activity> element found in {path}")

          attr = f"{{{ns}}}windowSoftInputMode"
          for activity in activities:
              activity.set(attr, "adjustResize")

          # <uses-permission> is a direct child of <manifest>, same level
          # as <application> — not nested under it or under <activity>,
          # unlike windowSoftInputMode above. Checked for existing entries
          # first so this stays a no-op if Tauri's own template ever
          # starts including either of these itself.
          name_attr = f"{{{ns}}}name"
          existing = {el.get(name_attr) for el in root.findall("uses-permission")}
          needed = ["android.permission.READ_EXTERNAL_STORAGE", "android.permission.WRITE_EXTERNAL_STORAGE"]
          added = 0
          for perm in needed:
              if perm in existing:
                  continue
              el = ET.Element("uses-permission")
              el.set(name_attr, perm)
              root.insert(0, el)
              added += 1

          # Round 31: exact alarms for reminders. (name, maxSdkVersion or None)
          alarm_perms = [
              ("android.permission.USE_EXACT_ALARM", None),
              ("android.permission.SCHEDULE_EXACT_ALARM", "32"),
          ]
          max_sdk_attr = f"{{{ns}}}maxSdkVersion"
          alarm_added = 0
          for perm, max_sdk in alarm_perms:
              if perm in existing:
                  continue
              el = ET.Element("uses-permission")
              el.set(name_attr, perm)
              if max_sdk:
                  el.set(max_sdk_attr, max_sdk)
              root.insert(0, el)
              alarm_added += 1

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(f"Patched {len(activities)} <activity> element(s) with windowSoftInputMode=adjustResize")
          print(f"Added {added} storage <uses-permission> entr{'y' if added == 1 else 'ies'} ({len(needed) - added} already present)")
          print(f"Added {alarm_added} exact-alarm <uses-permission> entr{'y' if alarm_added == 1 else 'ies'} ({len(alarm_perms) - alarm_added} already present)")
          PY

      # --target restricts this to the one ABI that's actually needed. The
      # Galaxy A13's chip is 64-bit capable, but Samsung ships this model
      # with a 32-bit OS, so it only reports armeabi-v7a as installable —
      # hence armv7, not aarch64. Going through npx here rather than
      # `npm run tauri -- ...` is deliberate: multiple independent bug
      # reports (tauri-apps/tauri#11890, GH discussion #10511) show npm's
      # own argument forwarding unreliably drops --target and silently
      # builds all four ABIs regardless — which is what exhausted the
      # runner's disk on an earlier mdix-cybs run (its own env dump showed
      # all four CARGO_TARGET_*_LINUX_ANDROID* vars set). Calling the
      # installed CLI directly avoids that layer entirely.
      - name: Capture build timestamp
        id: buildtime
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # Build identity, baked in at build time — src/lib/build-info.ts
      # picks these up via import.meta.env, and the debug panel shows
      # them front and center. Exists specifically so "is this actually
      # the build with the fix" never has to be inferred from workflow
      # run timestamps again — the app just says so.
      # Round B: the online side (sign-in now, sync and AI later) reads its Supabase address
      # and PUBLISHABLE key from the build. Both are public by design (RLS protects the data),
      # but pasting the SECRET key into the publishable slot would bake it into every APK, so
      # this step refuses to build with one. Missing values are only a warning: the APK still
      # builds and simply has its online features switched off.
      - name: Check Supabase build settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY secrets are not set - this APK builds with online features switched off."
            exit 0
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must start with https://"; exit 1 ;;
          esac
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY holds a SECRET key (sb_secret_...). Put the publishable key (sb_publishable_...) there; secret keys never go in the app."; exit 1 ;;
          esac
          python3 -c '
          import os, sys, json, base64
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          parts = key.split(".")
          if len(parts) == 3:
              payload = parts[1] + "=" * (-len(parts[1]) % 4)
              try:
                  role = json.loads(base64.urlsafe_b64decode(payload)).get("role")
              except Exception:
                  role = None
              if role == "service_role":
                  print("::error::SUPABASE_PUBLISHABLE_KEY is the legacy service_role key. Use the publishable key (sb_publishable_...) instead.")
                  sys.exit(1)
          '
          echo "Supabase build settings look fine."

      - name: Build APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ steps.buildtime.outputs.value }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx tauri android build --debug --target armv7

      - name: List built APKs
        run: find src-tauri/gen/android/app/build/outputs -name "*.apk" -exec ls -la {} \;

      # Tauri's --debug flag is meant to produce an already-signed APK, but
      # it's inconsistent in practice — upstream reports of it landing an
      # unsigned release/ build instead regardless of the flag (see
      # tauri-apps/tauri#11453, #6528). Rather than depend on that, sign
      # whatever APK actually got produced ourselves.
      #
      # With the four ANDROID_* secrets (created once by the "Make signing key"
      # workflow) every build is signed with the SAME key, so a new APK installs
      # OVER the previous one and keeps its data and the signed-in account.
      # Without them it falls back to a throwaway key generated fresh each run,
      # which Android treats as a different app: uninstall first. Setting only
      # some of the four is a mistake, and fails the build instead of silently
      # signing with the wrong key.
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under outputs/ — build step must not have produced one."
            exit 1
          fi
          echo "Signing: $APK"

          SET=0
          for v in "$KEYSTORE_B64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$v" ]; then SET=$((SET + 1)); fi
          done

          if [ "$SET" -eq 4 ]; then
            if ! echo "$KEYSTORE_B64" | base64 -d > release.keystore; then
              rm -f release.keystore
              echo "::error::ANDROID_KEYSTORE_B64 is not valid base64. Run the 'Make signing key' workflow again with replace=replace."
              exit 1
            fi
            KS=release.keystore
            echo "Signing with the stable MidNote key."
          elif [ "$SET" -eq 0 ]; then
            echo "::warning::No ANDROID_* signing secrets: signing with a throwaway key, so this APK cannot install over a previous one (uninstall first). Run the 'Make signing key' workflow once to fix that."
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=androiddebugkey
            KEY_PASSWORD=android
            keytool -genkeypair -v \
              -keystore debug.keystore -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MidNote Debug,O=MidManStudio,C=US"
            KS=debug.keystore
          else
            echo "::error::Only $SET of the 4 signing secrets are set (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Set all four, or none. Running 'Make signing key' with replace=replace sets all four."
            exit 1
          fi

          export KEYSTORE_PASSWORD KEY_PASSWORD
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out MidNote-signed.apk \
            "$APK"

          # --print-certs shows the signing certificate's fingerprint (public information).
          # With the stable key it is the SAME line in every build.
          "$BUILD_TOOLS/apksigner" verify --print-certs MidNote-signed.apk

          rm -f release.keystore debug.keystore
          mkdir -p signed-output
          mv MidNote-signed.apk signed-output/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MidNote-debug-apk
          path: signed-output/MidNote-signed.apk
          if-no-files-found: error
