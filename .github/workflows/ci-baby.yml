name: CI

# Fast compile-check on every push/PR — catches "doesn't even build" before
# you find out the hard way on a phone. Deliberately separate from
# build-android.yml: this doesn't produce an APK, it just answers
# "does this still compile, and does it actually run" in a couple minutes
# instead of ~15+.
#
# Type-check + Build catch "doesn't compile". Neither one ever executes a
# component, so neither catches code that builds clean but throws the
# instant it actually mounts — that gap is exactly how the
# effect_update_depth_exceeded incident (2026-08-22) got all the way to a
# phone before anyone saw it. Smoke test closes that gap: see
# docs/incidents/2026-08-22-effect-update-depth-exceeded.md and
# docs/svelte5-effect-safety.md.

on:
  push:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install deps
        run: npm install

      # svelte-kit sync + svelte-check + tsc — catches broken imports, bad
      # props, type errors, AND markup mistakes like an unclosed tag
      # (package.json's check script now runs svelte-check with
      # --fail-on-warnings). Without that flag this step is misleading:
      # tested it directly by deliberately breaking a component with an
      # unclosed <a> tag — svelte-check reported it but still exited 0,
      # and `vite build` also succeeded anyway, so neither step would
      # have failed CI on it. --fail-on-warnings turns that same warning
      # into a real exit 1. Re-ran against the actual current codebase
      # with the flag on afterward — still 0 errors, 0 warnings.
      - name: Type-check
        run: npm run check

      # The real vite build, same output SvelteKit would ship. Verified
      # this succeeds locally too — catches anything svelte-check alone
      # wouldn't (e.g. an actual bundling failure).
      - name: Build
        run: npm run build

      # Actually boots that build/ output — home, note (new + existing),
      # todo (new + existing) — in a headless DOM and fails if any of them
      # throw while mounting/settling. This is the step that would have
      # caught the effect_update_depth_exceeded incident: svelte-check and
      # Build both passed clean on the code that crashed on-device. See
      # scripts/smoke-test.mjs and docs/svelte5-effect-safety.md.
      - name: Smoke test
        run: npm run smoke

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri needs these system libs present to even type-check the crate
      # on Linux — same reason build-android.yml doesn't need them (Android
      # target doesn't link against the desktop webview).
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      # cargo check, not cargo build — same compile errors, no need to
      # actually link a binary just to prove the code is valid. Once
      # dixscript is added as a real dependency here (see the TODOs in
      # src-tauri/src/data/), this step needs Rust 1.80+ — dtolnay's
      # `stable` above tracks current stable automatically, so nothing to
      # bump here when that happens.
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
