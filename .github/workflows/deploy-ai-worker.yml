# MidNote AI proxy -> Cloudflare Workers (FREE plan). Brought to u by MidManStudio
#
# Run it from the Actions tab ("Run workflow"), or it runs when workers/midnote-ai/** changes on main
# and the change was pushed by a person (changes made by the replacements pipeline do not trigger
# other workflows - GitHub's rule - so after a pipeline round, press "Run workflow" once).
#
# Repo secrets it needs (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN        Cloudflare -> My Profile -> API Tokens -> template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID       Cloudflare dashboard -> Workers & Pages -> the Account ID on the right
#   SUPABASE_URL                already there (the app build uses it)
#   SUPABASE_PUBLISHABLE_KEY    already there
#   SUPABASE_SECRET_KEY         Supabase -> Project Settings -> API Keys -> the SECRET key (sb_secret_...)
#                               It lives ONLY in the Worker. It is never put in the APK.
#
# NEVER add a payment card to this Cloudflare account and never switch it to Workers Paid: on the free
# plan Workers AI stops with an error at 10,000 neurons/day instead of billing. That is the guarantee.
name: Deploy AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/midnote-ai/**"
      - ".github/workflows/deploy-ai-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Looks at the settings WITHOUT ever printing a value.
      - name: Check settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, json, base64
          def err(m):
              print("::error::" + m); sys.exit(1)
          missing = [n for n in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_SECRET_KEY") if not os.environ.get(n, "").strip()]
          if missing:
              err("Missing GitHub secret(s): " + ", ".join(missing) + ". See the comment at the top of this workflow.")
          url = os.environ["SUPABASE_URL"].strip()
          pub = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          sec = os.environ["SUPABASE_SECRET_KEY"].strip()
          if not url.startswith("https://"):
              err("SUPABASE_URL must start with https://")
          if sec == pub:
              err("SUPABASE_SECRET_KEY is the same value as SUPABASE_PUBLISHABLE_KEY. Put the SECRET key (sb_secret_...) there.")
          if sec.startswith("sb_publishable_"):
              err("SUPABASE_SECRET_KEY holds a publishable key. Put the SECRET key (sb_secret_...) there.")
          if sec.startswith("eyJ"):
              try:
                  payload = sec.split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  role = json.loads(base64.urlsafe_b64decode(payload)).get("role")
              except Exception:
                  role = None
              if role != "service_role":
                  err("SUPABASE_SECRET_KEY is a legacy key but not the service_role one (it looks like the anon key).")
          elif not sec.startswith("sb_secret_"):
              err("SUPABASE_SECRET_KEY should start with sb_secret_ (or be the legacy service_role key).")
          print("Settings look fine.")
          PY

      - name: Deploy the Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/midnote-ai
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SECRET_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      # Proves the three front doors really are shut to strangers, and tells you the URL to use in the app.
      - name: Smoke test and show the URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          CMD_OUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          URL="${DEPLOY_URL:-}"
          if [ -z "$URL" ]; then
            URL="$(printf '%s' "$CMD_OUT" | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' | head -1 || true)"
          fi
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::warning::Deployed, but the URL was not found in the output. Open Cloudflare -> Workers & Pages -> midnote-ai to read it."
            exit 0
          fi
          echo "Worker URL: $URL"
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          H="$(code "$URL/health")"
          R="$(code -X POST -H 'content-type: application/json' -d '{"task":"create","prompt":"hi"}' "$URL/v1/ai/run")"
          S="$(code "$URL/v1/ai/status")"
          echo "health=$H  run-without-sign-in=$R  status-without-sign-in=$S"
          [ "$H" = "200" ] || { echo "::error::/health did not answer 200 (got $H)"; exit 1; }
          [ "$R" = "401" ] || { echo "::error::an anonymous AI request was NOT refused with 401 (got $R). 503 means the Worker is missing a secret or the AI binding."; exit 1; }
          [ "$S" = "401" ] || { echo "::error::anonymous /v1/ai/status was not refused with 401 (got $S)"; exit 1; }
          {
            echo "### MidNote AI Worker is live"
            echo ""
            echo "URL: \`$URL\`"
            echo ""
            echo "Next: add a GitHub secret named **AI_PROXY_URL** with exactly that URL (no trailing slash). The next app round reads it."
            echo ""
            echo "Anonymous requests are refused (401). Free-plan reminder: never add a card to this Cloudflare account."
          } >> "$GITHUB_STEP_SUMMARY"
