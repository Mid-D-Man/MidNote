[package]
name = "midnote"
version = "0.1.0"
description = "A Tauri App"
authors = ["MidManStudio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "midnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Real DixScript-Rust encryption for the Lock feature (src-tauri/src/data/crypto.rs)
# — published on crates.io as "dixscript" (confirmed via the crates.io API; same
# crate as https://github.com/Mid-D-Man/DixScript-Rust's `dixscript/` directory).
dixscript = "1.0.0"
# Needed to construct DixData::from_ast's compile_time argument (crypto.rs) — a
# dependency of dixscript itself, but Rust doesn't let a crate use another
# crate's *dependency* types without depending on it directly too.
chrono = "0.4"
# Locked payloads are base64-wrapped before being embedded as a DixScript
# string literal (see crypto.rs's doc comment for why) and unwrapped on
# unlock — this is the standard, actively maintained base64 crate, not
# something dixscript already pulls in.
base64 = "0.23"

